[build]
builder = "NIXPACKS"

[phases.setup]
nixPkgs = ["python3", "nodejs", "npm"]

[phases.build]
cmds = [
  "pip install --upgrade pip",
  "pip install -r requirements.txt",
  "npm install",
  "npm run build:css"
]

[deploy]
startCommand = "python manage.py migrate && python manage.py createsuperuser --noinput || true && python manage.py collectstatic --noinput && gunicorn language_listening_practice_app.wsgi"
